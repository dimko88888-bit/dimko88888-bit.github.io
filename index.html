<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Official privacy information for Sudoku Journey.">
  <title>Sudoku Journey</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5efdf;
      --paper-deep: #e7dcc3;
      --ink: #26372d;
      --sage: #647b69;
      --line: rgba(38, 55, 45, .18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,.75), transparent 34%),
        linear-gradient(145deg, var(--paper), var(--paper-deep));
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      width: min(680px, 100%);
      padding: clamp(28px, 7vw, 58px);
      text-align: center;
      background: rgba(255,255,255,.45);
      border: 1px solid var(--line);
      border-radius: 24px 8px 24px 8px;
      box-shadow: 0 18px 60px rgba(38, 55, 45, .12);
    }
    .mark {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      color: #fff;
      background: var(--sage);
      font-size: 29px;
    }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 3.7rem); font-weight: 500; }
    p { margin: 18px auto 30px; max-width: 500px; line-height: 1.7; }
    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 999px;
      color: #fff;
      background: var(--sage);
      font-weight: 700;
      text-decoration: none;
    }
    a:hover, a:focus-visible { background: var(--ink); }
    small { display: block; margin-top: 28px; opacity: .65; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">数</div>
    <h1>Sudoku Journey</h1>
    <p>A calm Sudoku experience inspired by Japanese ink, watercolor and the rhythm of a journey.</p>
    <a href="privacy-policy/">Read the Privacy Policy</a>
    <small>Official information for the Android application</small>
  </main>
</body>
</html>
